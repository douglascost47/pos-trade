name: postrade-lab

# Ambiente local da Etapa 0:
#   - mssql              SQL Server 2022: backend do emulador + bancos dos serviços
#   - db-init            cria os bancos dos 4 serviços (roda uma vez e termina)
#   - servicebus         emulador do Azure Service Bus (AMQP 5672, gestão/health 5300)
#   - seq                logs estruturados (UI em http://localhost:5341)
#
# Uso:  cp .env.example .env  &&  docker compose up -d
# Ver:  ./scripts/check-env.sh   (ou scripts/check-env.ps1 no Windows)

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: postrade-mssql
    environment:
      ACCEPT_EULA: "${ACCEPT_EULA}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql          # bancos dos serviços sobrevivem a restart
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [postrade]

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: postrade-db-init
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - ./deploy/sql:/scripts:ro
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -i /scripts/01-create-databases.sql"]
    restart: "no"
    networks: [postrade]

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: postrade-servicebus
    pull_policy: always
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "${ACCEPT_EULA}"
      SQL_SERVER: mssql                      # nome do serviço acima, na rede postrade
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      SQL_WAIT_INTERVAL: "${SQL_WAIT_INTERVAL:-15}"
      EMULATOR_HTTP_PORT: "5300"
    volumes:
      - ./deploy/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"                          # AMQP (envio e recebimento)
      - "5300:5300"                          # API de gestão e /health
    networks:
      postrade:
        aliases: [sb-emulator]

  seq:
    image: datalust/seq:latest
    container_name: postrade-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"  # só para ambiente local
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    networks: [postrade]

volumes:
  mssql-data:
  seq-data:

networks:
  postrade:
